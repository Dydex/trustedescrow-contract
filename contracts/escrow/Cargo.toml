[package]
name = "trustescrow-escrow"
description = "TrustEscrow escrow contract: one instance per trade, two-sided release"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
trustescrow-types = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
trustescrow-types = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils", "trustescrow-types/testutils"]
