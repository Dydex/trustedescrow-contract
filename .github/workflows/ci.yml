name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match the channel pinned in rust-toolchain.toml: this action's
      # @ref picks the toolchain itself and does not read that file, so a
      # mismatch here would build with a different compiler than the pin.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # The factory tests deploy the real escrow WASM, so build it first.
      - name: Build WASM
        run: make build

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: WASM sizes and hashes
        run: |
          ls -l target/wasm32v1-none/release/*.wasm
          sha256sum target/wasm32v1-none/release/*.wasm
